name: 反馈问题
description: 某个 skill 的流程、提示词或脚本没有按预期工作
labels: [bug]
body:
  - type: dropdown
    id: skill
    attributes:
      label: 哪个 skill
      options: [nuwa, nuwa-casting, nuwa-body, nuwa-wardrobe, nuwa-studio, nuwa-set, nuwa-motion, nuwa-polish, nuwa-dance, nuwa-vlog, nuwa-showcase, nuwa-bts, nuwa-aesthetic, image-upscale, 安装脚本, 不确定]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 用的生成模型和通道
      description: 例如 GPT Image（ChatGPT 网页版）、Nano Banana Pro（API）、Wan 3.0 720P
  - type: input
    id: agent
    attributes:
      label: 用的 Agent
      description: 例如 Claude Code、Codex，以及版本
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你让 Agent 做了什么，实际结果是什么，你期望的是什么。能附提示词原文和出图更好（注意别贴密钥）
    validations:
      required: true
